<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>긴 파장의 전자기파는 왜 작은 물체는 지나가면서 작은 구멍은 통과하지 못할까?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">

  <h1>긴 파장의 전자기파는 왜 작은 물체는 지나가면서 작은 구멍은 통과하지 못할까?</h1>

  <div class="sections">

    <section class="section section--pass">
      <h2>물체를 지나가는 파동</h2>
      <div class="cards">

        <a class="card" href="https://wavescale-diffraction.vercel.app/hub.html" target="_blank" rel="noopener">
          <h3 class="card__title">파장이 물체의 크기와 비슷하거나 조금 더 길 때 — 회절</h3>
          <p class="card__cond">λ ≳ a</p>
          <p class="card__note">a = 물체의 크기</p>
        </a>

        <a class="card" href="https://wavescale-scattering.vercel.app" target="_blank" rel="noopener">
          <h3 class="card__title">파장이 물체의 크기보다 훨씬 길 때 — 산란</h3>
          <p class="card__cond">λ ≫ a</p>
          <p class="card__note">a = 물체의 크기</p>
        </a>

      </div>
    </section>

    <section class="section section--block">
      <h2>구멍에서 차단되는 파동</h2>
      <div class="cards">

        <a class="card" href="https://wavescale-grid.vercel.app" target="_blank" rel="noopener">
          <h3 class="card__title">도선 격자(금속망)에 의한 차폐</h3>
          <p class="card__cond">λ &gt; d</p>
          <p class="card__note">d = 도선 사이 간격</p>
        </a>

        <a class="card" href="https://wavescale-waveguide.vercel.app" target="_blank" rel="noopener">
          <h3 class="card__title">도파관(도체 관)에 의한 차단</h3>
          <p class="card__cond">λ &gt; 2a</p>
          <p class="card__note">a = 두 벽 사이의 간격</p>
        </a>

      </div>
    </section>

  </div>

</main>

</body>
</html>
